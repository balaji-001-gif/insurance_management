[project]
name = "insurance_management"
version = "1.0.0"
description = "Comprehensive Insurance Management System with AI-powered features for ERPNext v15 + Frappe Framework"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Your Company", email = "support@yourcompany.com" },
]

dependencies = [
    # Core AI/ML Dependencies
    "scikit-learn>=1.3.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scipy>=1.11.0",

    # NLP and Text Processing
    "transformers>=4.30.0",
    "sentence-transformers>=2.2.0",
    "nltk>=3.8",

    # OCR and Image Processing
    "opencv-python>=4.8.0",
    "pytesseract>=0.3.10",
    "Pillow>=10.0.0",
    "pdf2image>=1.16.0",

    # AI Service Integrations
    "openai>=0.27.0",
    "anthropic>=0.3.0",

    # Document Processing
    "python-docx>=0.8.11",
    "PyPDF2>=3.0.0",
    "pdfplumber>=0.9.0",

    # Data Validation
    "pydantic>=2.0.0",
    "email-validator>=2.0.0",

    # Payment Gateway Integrations
    "razorpay>=1.3.0",
    "stripe>=5.5.0",

    # SMS and Communication
    "twilio>=8.5.0",
    "requests>=2.31.0",

    # Utilities
    "python-dateutil>=2.8.2",
    "phonenumbers>=8.13.0",
]

[build-system]
requires = ["flit_core>=3.4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0"
erpnext = ">=15.0.0"
